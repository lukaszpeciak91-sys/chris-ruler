name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore win-x64 dependencies
        run: dotnet restore src/ChrisRuler/ChrisRuler.csproj --runtime win-x64

      - name: Build Release
        run: dotnet build ChrisRuler.sln --configuration Release --no-restore

      - name: Publish portable win-x64 executable
        run: dotnet publish src/ChrisRuler/ChrisRuler.csproj --configuration Release --no-restore -p:PublishProfile=win-x64

      - name: Verify published executable
        shell: pwsh
        run: |
          $publishDirectory = "src/ChrisRuler/bin/publish/win-x64"
          $executable = Join-Path $publishDirectory "ChrisRuler.exe"

          Write-Host "Published files:"
          Get-ChildItem -Path $publishDirectory -File | Format-Table Name, Length

          if (-not (Test-Path -Path $executable -PathType Leaf)) {
            throw "Expected portable executable was not produced: $executable"
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ChrisRuler-win-x64
          path: src/ChrisRuler/bin/publish/win-x64/ChrisRuler.exe
          if-no-files-found: error

