name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore win-x64 dependencies
        run: dotnet restore src/ChrisRuler/ChrisRuler.csproj --runtime win-x64

      - name: Build Release
        run: dotnet build ChrisRuler.sln --configuration Release --no-restore

      - name: Publish single-file diagnostic build
        run: dotnet publish src/ChrisRuler/ChrisRuler.csproj --configuration Release --no-restore -p:PublishProfile=win-x64

      - name: Publish self-contained release folder
        run: dotnet publish src/ChrisRuler/ChrisRuler.csproj --configuration Release --no-restore -p:PublishProfile=win-x64-folder

      - name: Verify published outputs and record SHA-256
        shell: pwsh
        run: |
          $publishVariants = @(
            @{
              Name = "ChrisRuler-win-x64-single-file-diagnostic"
              Directory = "src/ChrisRuler/bin/publish/win-x64"
            },
            @{
              Name = "ChrisRuler-win-x64-folder"
              Directory = "src/ChrisRuler/bin/publish/win-x64-folder"
            }
          )

          foreach ($variant in $publishVariants) {
            $publishDirectory = $variant.Directory
            $executable = Join-Path $publishDirectory "ChrisRuler.exe"
            Write-Host "Published files in ${publishDirectory}:"
            Get-ChildItem -Path $publishDirectory -File | Format-Table Name, Length

            if (-not (Test-Path -Path $executable -PathType Leaf)) {
              throw "Expected executable was not produced: $executable"
            }

            $hash = (Get-FileHash -Path $executable -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLine = "$hash  $($variant.Name)/ChrisRuler.exe"
            Write-Host "SHA-256 [$($variant.Name)] ${executable}: $hash"
            Set-Content -Path (Join-Path $publishDirectory "ChrisRuler.exe.sha256.txt") -Value $hashLine -Encoding ascii
          }

      - name: Upload single-file diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: ChrisRuler-win-x64-single-file-diagnostic
          path: |
            src/ChrisRuler/bin/publish/win-x64/ChrisRuler.exe
            src/ChrisRuler/bin/publish/win-x64/ChrisRuler.exe.sha256.txt
          if-no-files-found: error

      - name: Upload self-contained release folder
        uses: actions/upload-artifact@v4
        with:
          name: ChrisRuler-win-x64-folder
          path: src/ChrisRuler/bin/publish/win-x64-folder/
          if-no-files-found: error
